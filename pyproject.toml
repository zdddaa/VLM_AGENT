[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-agent"
version = "0.1.0"
description = "Object-centric remote-sensing semantic change understanding agent"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "VLM_AGENT contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
